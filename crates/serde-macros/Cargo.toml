lints.workspace = true

[package]
name = "netcalyx-serde-macros"
version = "0.2.0"
edition = "2024"
authors = ["NetCalyx Authors"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/network-analytics/NetCalyx"
homepage = "https://github.com/network-analytics/NetCalyx"
description = """
Helper macros to make ser/deser binary protocols easier
"""
keywords = ["protocol"]
categories = ["parsing"]

[lib]
proc-macro = true

[[test]]
name = "tests"
path = "tests/tests.rs"

[dependencies]
syn = { workspace = true, default-features = true, features = ["extra-traits", "full"] }
quote = { workspace = true, default-features = true }

[dev-dependencies]
netcalyx-parse-utils = { workspace = true }
netcalyx-locate = { workspace = true }
nom = { workspace = true }
trybuild = { workspace = true, features = ["diff"] }
