lints.workspace = true

[package]
name = "netcalyx-ipfix-code-generator"
version = "0.2.0"
edition = "2024"
authors = ["NetCalyx Authors"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/network-analytics/NetCalyx"
homepage = "https://github.com/network-analytics/NetCalyx"
description = """
Generate Rust code bindings for IPFIX Information Elements
"""
keywords = ["ipfix", "netflow", "parser", "code", "generator"]
categories = ["network-programming"]

[dependencies]
reqwest = { workspace = true, default-features = false, features = ["blocking", "rustls"] }
roxmltree = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
regex = { workspace = true }
syn = { workspace = true, default-features = false, features = ["parsing", "printing"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
prettyplease = { workspace = true }
