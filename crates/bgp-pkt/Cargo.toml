lints.workspace = true

[package]
name = "netcalyx-bgp-pkt"
version = "0.2.0"
edition = "2024"
authors = ["NetCalyx Authors"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/network-analytics/NetCalyx"
homepage = "https://github.com/network-analytics/NetCalyx"
description = """
BGP-4 Protocol representation and serde.
"""
keywords = ["bgp", "parser", "protocol"]
categories = ["network-programming", "parsing"]

[dependencies]
netcalyx-iana = { workspace = true }
netcalyx-locate = { workspace = true, optional = true }
netcalyx-parse-utils = { workspace = true, optional = true }
netcalyx-serde-macros = { workspace = true, optional = true }
ipnet = { workspace = true, features = ["serde"] }
strum_macros = { workspace = true }
serde = { workspace = true, features = ["derive"] }
nom = { workspace = true, optional = true }
byteorder = { workspace = true, optional = true }
criterion = { workspace = true, optional = true } # Dev dep for bench
arbitrary = { workspace = true, optional = true }
arbitrary_ext = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tokio-util = { workspace = true, default-features = false, features = ["codec"], optional = true }
bytes = { workspace = true, optional = true }
schemars = { workspace = true, features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = [
    "nom",
    "byteorder",
    "netcalyx-locate",
    "netcalyx-parse-utils",
    "netcalyx-serde-macros",
]
codec = ["tracing", "tokio-util", "bytes"]
bench = ["criterion", "codec"]
fuzz = ["arbitrary", "arbitrary_ext"]
json-schema = ["schemars", "netcalyx-iana/json-schema", "ipnet/schemars1"]

[dev-dependencies]
netcalyx-pcap-reader = { workspace = true }
netcalyx-parse-utils = { workspace = true, features = ["test-helpers"] }
serde_json = { workspace = true }
rstest = { workspace = true }
pcap-parser = { workspace = true, features = ["data"] }

[[bench]]
name = "serde_benchmark"
harness = false
required-features = ["bench"]
