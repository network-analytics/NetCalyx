lints.workspace = true

[package]
name = "netcalyx-collector"
version = "0.2.0"
edition = "2024"
authors = ["NetCalyx Authors"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/network-analytics/NetCalyx"
homepage = "https://github.com/network-analytics/NetCalyx"
description = """
Network metrics collector
"""
keywords = ["ipfix", "netflow", "parser", "protocol"]
categories = ["network-programming", "parsing"]
build = "build.rs"

[package.metadata.generate-rpm]
assets = [
  { source = "crates/collector/LICENSE", dest = "/usr/share/doc/netcalyx-collector/LICENSE", mode = "644", doc = true },
  { source = "crates/collector/README.md", dest = "/usr/share/doc/netcalyx-collector/README.md", mode = "644", doc = true },
  { source = "target/release/netcalyx-collector", dest = "/usr/bin/netcalyx-collector", mode = "755", caps = "cap_net_raw+ep" },
]

[package.metadata.deb]
maintainer = "NetCalyx Authors"
copyright = "NetCalyx Authors"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/netcalyx-collector", "usr/bin/netcalyx-collector", "755"],
  ["LICENSE", "usr/share/doc/netcalyx-collector/LICENSE", "644"],
  ["README.md", "usr/share/doc/netcalyx-collector/README.md", "644"],
]

[dependencies]
netcalyx-analytics = { workspace = true }
netcalyx-flow-service = { workspace = true }
netcalyx-flow-pkt = { workspace = true, features = ["codec"] }
netcalyx-bmp-service = { workspace = true }
netcalyx-bmp-pkt = { workspace = true }
netcalyx-bgp-pkt = { workspace = true }
netcalyx-udp-notif-service = { workspace = true }
netcalyx-udp-notif-pkt = { workspace = true }
netcalyx-yang-push = { workspace = true }
netcalyx-serde-macros = { workspace = true }
netcalyx-iana = { workspace = true }
netcalyx-netconf-proto = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros", "tracing"] }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
async-channel = { workspace = true }
serde_with = { workspace = true, features = ["default"] }
reqwest = { workspace = true, default-features = false, features = [
    "http2",
    "json",
    "stream",
    "rustls",
] }
chrono = { workspace = true, default-features = true }
tracing-subscriber = { workspace = true, features = ["env-filter"]}
anyhow = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics", "trace", "logs"] }
opentelemetry_sdk = { workspace = true, features = [
    "metrics",
    "trace",
    "logs",
    "rt-tokio",
] }
opentelemetry-otlp = { workspace = true, features = [
    "metrics",
    "trace",
    "logs",
    "grpc-tonic",
] }
apache-avro = { workspace = true, features = ["derive"] }
indexmap = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
schema_registry_converter = { workspace = true, default-features = false, features = [
    "avro",
    "futures",
    "rustls_tls",
] }
rdkafka = { workspace = true, features = [
    "tokio",
    "cmake-build",
    "ssl-vendored",
] }
either = { workspace = true }
pin-utils = { workspace = true }
serde_yaml = { workspace = true }
ordered-float = { workspace = true }
ciborium = { workspace = true }
bytes = { workspace = true }
shadow-rs = { workspace = true, features = ["default", "metadata", "build"] }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
ipnet = { workspace = true, features = ["serde"] }
notify = { workspace = true }
sysinfo = { workspace = true, default-features = false, features = ["system"] }
criterion = { workspace = true, optional = true } # dev-dependency for benchmarks
schema-registry-client = { workspace = true }
russh = { workspace = true }
clap = { workspace = true, features = ["derive"] }


[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = [
    "unprefixed_malloc_on_supported_platforms",
] }

[build-dependencies]
shadow-rs = { workspace = true, default-features = true }

[dev-dependencies]
chrono = { workspace = true, default-features = false, features = [
    "std",
    "clock",
] }
tempfile = { workspace = true }
tracing-test = { workspace = true }

[features]
bench = ["criterion"]

[[bench]]
name = "enrich_ipfix_packet"
harness = false
required-features = ["bench"]
