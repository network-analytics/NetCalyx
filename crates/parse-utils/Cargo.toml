lints.workspace = true

[package]
name = "netcalyx-parse-utils"
version = "0.12.1"
edition = "2024"
authors = ["NetCalyx Authors"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/network-analytics/NetCalyx"
homepage = "https://github.com/network-analytics/NetCalyx"
description = """
Serialization/Deserialization utilities for NetCalyx
"""
keywords = ["protocol"]
categories = ["parsing"]

[dependencies]
netcalyx-locate = { workspace = true  }
nom = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[features]
test-helpers = []
