lints.workspace = true

[package]
name = "netcalyx-analytics"
version = "0.12.1"
edition = "2024"
authors = ["NetCalyx Authors"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/network-analytics/NetCalyx"
homepage = "https://github.com/network-analytics/NetCalyx"
description = """
Analytics infrastructure related library
"""
keywords = ["streaming", "real-time", "analytics"]
categories = ["algorithms", "data-structures"]

[dependencies]
either = { workspace = true }
chrono = { workspace = true, default-features = false }
strum_macros = { workspace = true }
serde = { workspace = true, features = ["derive"] }
futures-core = { workspace = true }
pin-project = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, default-features = false, features = ["test-util", "macros"] }
futures = { workspace = true }
