lints.workspace = true

[package]
name = "netcalyx-iana"
version = "0.12.1"
edition = "2024"
authors = ["NetCalyx Authors"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/network-analytics/NetCalyx"
homepage = "https://github.com/network-analytics/NetCalyx"
description = """
Collection of generic Internet Naming Authority (IANA) definitions that are not specific to a single protocol.
"""
keywords = ["protocol", "iana"]
categories = ["network-programming"]

[dependencies]
strum_macros = { workspace = true }
serde = { workspace = true, features = ["derive"] }
arbitrary = { workspace = true, optional = true }
schemars = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = []
fuzz = ["arbitrary"]
json-schema = ["schemars"]
