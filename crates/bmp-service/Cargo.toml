lints.workspace = true

[package]
name = "netcalyx-bmp-service"
version = "0.12.1"
edition = "2024"
authors = ["NetCalyx Authors"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/network-analytics/NetCalyx"
homepage = "https://github.com/network-analytics/NetCalyx"
description = """
BMP Protocol Server.
"""
keywords = ["bmp", "bgp", "parser", "protocol"]
categories = ["network-programming", "parsing"]

[dependencies]
netcalyx-bmp-pkt = { workspace = true, features = ["serde", "codec"] }

tokio = { workspace = true, default-features = false, features = ["macros", "net", "time"] }
tokio-util = { workspace = true, default-features = false }
futures = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
futures-core = { workspace = true }
pin-project = { workspace = true }
tokio-stream = { workspace = true, default-features = false }
tower = { workspace = true, default-features = false, features = ["buffer", "util"] }
tower-service = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
socket2 = { workspace = true }
async-channel = { workspace = true }
either = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics", "trace", "logs"] }
strum_macros = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, default-features = false, features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-test = { workspace = true }
rand = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"]}
tracing-test = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
