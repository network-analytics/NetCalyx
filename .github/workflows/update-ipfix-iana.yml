name: Update IANA IPFIX registry

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:     # Allow manual triggering

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Check IANA IPFIX registry for updates
        run: |
          cd crates/flow-pkt
          ./release.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --exit-code crates/flow-pkt/registry; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Short-lived GitHub App token, so CI runs on the PR
      - name: Generate app token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NETCALYX_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.NETCALYX_BOT_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update IANA IPFIX registry"
          branch: chore/ipfix-iana
          branch-suffix: timestamp
          title: "chore: update IANA IPFIX registry"
          body: |
            Automated update IANA IPFIX registry.

            This PR was created by the **Update IANA IPFIX registry** workflow.
          labels: dependencies, automated
          delete-branch: true
          # Commit via the API so the app bot is author/committer
          # (default author is github.actor)
          sign-commits: true
