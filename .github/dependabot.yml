version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        # Dependency management workflow:
        # - Weekly `cargo update` (update-cargo-lock.yml): semver-compatible bumps in Cargo.lock.
        # - Dependabot (daily): breaking bumps (1.x -> 2.0, 0.32 -> 0.33). Minor stays enabled
        #   for 0.x; redundant >=1.0 minor PRs auto-close once cargo update lands.
        # - Dependabot security updates: any semver level, regardless of this rule
        #   (if enabled at repo settings)
        update-types:
          - "version-update:semver-patch"
    # Crates that share types across their public APIs should be bumped together
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-subscriber"
      avro:
        patterns:
          - "apache-avro"
          - "schema_registry_converter"
          - "schema-registry-client"
      syn:
        patterns:
          - "syn"
          - "quote"
          - "proc-macro2"
          - "prettyplease"
      strum:
        patterns:
          - "strum"
          - "strum_macros"
      tower:
        patterns:
          - "tower"
          - "tower-service"
      arbitrary:
        patterns:
          - "arbitrary"
          - "arbitrary_ext"
