[package]
name = "netcalyx-fuzz"
version = "0.2.0"
publish = false
edition = "2024"
authors = ["NetCalyx Authors"]
license = "Apache-2.0"
readme = "README.md"
description = """Fuzzers for NetCalyx"""
repository = "https://github.com/network-analytics/NetCalyx"
homepage = "https://github.com/network-analytics/NetCalyx"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
netcalyx-parse-utils = { path = "../crates/parse-utils" }
netcalyx-iana = { path = "../crates/iana", features = ["fuzz"] }
netcalyx-bgp-pkt = { path = "../crates/bgp-pkt", features = ["serde", "fuzz"] }
netcalyx-bgp-speaker = { path = "../crates/bgp-speaker", features = ["fuzz"] }
netcalyx-bmp-pkt = { path = "../crates/bmp-pkt", features = ["serde", "fuzz"] }
netcalyx-flow-pkt = { path = "../crates/flow-pkt", features = [
    "serde",
    "fuzz",
    "codec",
] }
netcalyx-udp-notif-pkt = { path = "../crates/udp-notif-pkt", features = [
    "serde",
    "fuzz",
    "codec",
] }
netcalyx-netconf-proto = { path = "../crates/netconf-proto" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-test = { workspace = true }
tokio-util = { workspace = true }
futures-core = { workspace = true }
bytes = { workspace = true }
quick-xml = { workspace = true, features = ["serialize", "async-tokio"] }

[[bin]]
name = "fuzz-bgp-peer"
path = "fuzz_targets/fuzz_bgp_peer.rs"
test = false
doc = false

[[bin]]
name = "fuzz-bgp-pkt"
path = "fuzz_targets/fuzz_bgp_pkt.rs"
test = false
doc = false

[[bin]]
name = "fuzz-bgp-pkt-serialize"
path = "fuzz_targets/fuzz_bgp_pkt_serialize.rs"
test = false
doc = false

[[bin]]
name = "fuzz-bmp-pkt"
path = "fuzz_targets/fuzz_bmp_pkt.rs"
test = false
doc = false

[[bin]]
name = "fuzz-bmp-pkt-serialize"
path = "fuzz_targets/fuzz_bmp_pkt_serialize.rs"
test = false
doc = false

[[bin]]
name = "fuzz-ipfix-pkt"
path = "fuzz_targets/fuzz_ipfix_pkt.rs"
test = false
doc = false

[[bin]]
name = "fuzz-ipfix-pkt-serialize"
path = "fuzz_targets/fuzz_ipfix_pkt_serialize.rs"
test = false
doc = false

[[bin]]
name = "fuzz-netflow-v9-pkt"
path = "fuzz_targets/fuzz_netflow_v9_pkt.rs"
test = false
doc = false

[[bin]]
name = "fuzz-netflow-v9-pkt-serialize"
path = "fuzz_targets/fuzz_netflow_v9_pkt_serialize.rs"
test = false
doc = false

[[bin]]
name = "fuzz-flow-codec"
path = "fuzz_targets/fuzz_flow_codec.rs"
test = false
doc = false


[[bin]]
name = "fuzz-udp-notif-pkt"
path = "fuzz_targets/fuzz_udp_notif_pkt.rs"
test = false
doc = false

[[bin]]
name = "fuzz-udp-notif-pkt-serialize"
path = "fuzz_targets/fuzz_udp_notif_pkt_serialize.rs"
test = false
doc = false


[[bin]]
name = "fuzz-netconf"
path = "fuzz_targets/fuzz_netconf.rs"
test = false
doc = false
